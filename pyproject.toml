[project]
name = "travelclaw"
version = "0.1.0"
description = "AI旅行规划团队 - 模仿OpenClaw多Agent架构的最小化实现"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "tenacity>=8.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "websockets>=12.0",
]
db = [
    "sqlmodel>=0.0.16",
    "aiosqlite>=0.19",
    "alembic>=1.13",
    "greenlet>=3.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "httpx>=0.27",
    "ruff>=0.3",
]
all = ["travelclaw[api,db,dev]"]

[project.scripts]
travelclaw = "travelclaw.main:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
